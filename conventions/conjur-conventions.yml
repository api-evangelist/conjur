authentication:
  style: two-step-token
  detail: >-
    Authenticate with basic auth (username + API key) or a cloud-native
    authenticator (authn-iam / authn-azure / authn-gcp / authn-k8s / authn-jwt /
    authn-oidc / authn-ldap) to obtain a short-lived base64 access token, then
