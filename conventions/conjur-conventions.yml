idempotency:
  supported: false
  detail: >-
    Conjur exposes no Idempotency-Key header. Idempotency is achieved
    structurally instead: policy loads use PUT (replace, fully idempotent) vs
    POST (append) vs PATCH (update); secret writes (createSecret) create a new
    version each call (Conjur retains the last 20 versions).
pagination:
  style: offset-limit
  params:
    limit: Return no more than this number of results (default 10 when offset is set).
    offset: Skip this many results before returning the rest.
    count: Return only the count of matching results (boolean).
  applies_to: [showResourcesForAccount, showResourcesForKind, showResourcesForAllAccounts]
versioning:
