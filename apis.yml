aid: conjur
name: Conjur
description: >-
  Conjur is CyberArk's open-source secrets management platform. It automatically
  secures secrets used by privileged users and machine identities across CI/CD,
  cloud, and Kubernetes environments. Conjur uses a role-based access control
  (RBAC) model, policy-as-code, and pluggable cloud-native authenticators (AWS
  IAM, Azure, GCP, Kubernetes, JWT, OIDC, LDAP) to issue short-lived access
  tokens and broker secret retrieval, rotation, and auditing. Originally Conjur
  Inc. (backed by Amplify Partners), it was acquired by CyberArk and is now part
  of Palo Alto Networks. The Conjur / CyberArk Secrets Manager REST API is
  published as an OpenAPI 3.1 definition with official Ruby, Python, Go, Java,
  and .NET client libraries, a CLI, and an official MCP server.
